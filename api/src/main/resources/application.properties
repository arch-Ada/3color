spring.application.name=3Color
server.port=18380
server.tomcat.threads.max=16
server.tomcat.connection-timeout=10s
management.endpoints.web.exposure.include=health
springdoc.swagger-ui.path=/swagger-ui.html
server.error.include-message=never

# Optional catalogue. Local/file-bank operation remains the default.
threecolor.supply.enabled=${THREECOLOR_SUPPLY_ENABLED:false}
threecolor.supply.jdbc-url=${THREECOLOR_DB_URL:}
threecolor.supply.username=${THREECOLOR_DB_USER:}
threecolor.supply.password=${THREECOLOR_DB_PASSWORD:}
threecolor.worker.interval-seconds=${THREECOLOR_WORKER_INTERVAL_SECONDS:10}
threecolor.worker.target-per-cell=${THREECOLOR_WORKER_TARGET_PER_CELL:0}
threecolor.worker.first-seed=${THREECOLOR_WORKER_FIRST_SEED:1000000}
threecolor.worker.lease-seconds=${THREECOLOR_WORKER_LEASE_SECONDS:600}
# Reject obsolete/unknown request fields instead of silently ignoring them.
spring.jackson.deserialization.fail-on-unknown-properties=true
