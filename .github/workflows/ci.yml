name: Verify 3Color
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: threecolor_test
          POSTGRES_USER: threecolor_test
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U threecolor_test -d threecolor_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      THREECOLOR_TEST_DB_URL: jdbc:postgresql://127.0.0.1:5432/threecolor_test
      THREECOLOR_TEST_DB_USER: threecolor_test
      THREECOLOR_TEST_DB_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run check && npm test && npm run build
        working-directory: web
      - run: ./gradlew test :api:bootJar :benchmarks:jmhClasses --no-daemon
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run test:e2e
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            web/test-results/
      - run: docker build -t three-color:ci .
